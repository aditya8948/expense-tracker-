<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 650px;
            margin-bottom: 20px;
        }
        .logout-btn {
            padding: 5px 12px;
            cursor: pointer;
            background-color: #dc3545;
            color: white;
            border: 1px solid #dc3545;
            border-radius: 3px;
        }
        form {
            margin-bottom: 25px;
            padding: 15px;
            border: 1px solid #ddd;
            width: fit-content;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: inline-block;
            width: 170px;
            font-weight: bold;
        }
        input, select {
            padding: 5px 8px;
            width: 220px;
        }
        .submit-btn {
            padding: 6px 14px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: 1px solid #007bff;
            border-radius: 3px;
        }
        .submit-btn:hover {
            background-color: #0056b3;
        }
        table {
            width: 100%;
            max-width: 650px;
            border-collapse: collapse;
            margin-top: 15px;
        }
        table, th, td {
            border: 1px solid #ccc;
        }
        th, td {
            padding: 8px 12px;
            text-align: left;
        }
        th {
            background-color: #f5f5f5;
        }
        .delete-btn {
            padding: 4px 10px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .delete-btn:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>Expense Tracker</h2>
        <button id="logoutBtn" class="logout-btn">Logout</button>
    </div>

    <!-- Task 1: Form for entering money spent, description, and category dropdown -->
    <form id="expenseForm">
        <div class="form-group">
            <label for="amount">Choose expenseamount:</label>
            <input type="number" id="amount" name="amount" required placeholder="Enter amount">
        </div>

        <div class="form-group">
            <label for="description">Choose description:</label>
            <input type="text" id="description" name="description" required placeholder="Enter description">
        </div>

        <div class="form-group">
            <label for="category">Choose a category:</label>
            <select id="category" name="category" required>
                <option value="Food">Food</option>
                <option value="Petrol">Petrol</option>
                <option value="Salary">Salary</option>
                <option value="Movie">Movie</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <button type="submit" id="addExpenseBtn" class="submit-btn">Add Expense</button>
    </form>

    <!-- Task 3: Expense Table -->
    <h3>Expenses</h3>
    <table id="expenseTable">
        <thead>
            <tr>
                <th>Expense Amount</th>
                <th>Description</th>
                <th>Category</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="expenseTableBody">
            <!-- Expenses will be dynamically loaded/added here -->
        </tbody>
    </table>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="expense.js"></script>
</body>
</html>
