<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 30px 15px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 25px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .header h2 {
            margin: 0;
            color: #333;
            font-size: 22px;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .premium-btn {
            padding: 6px 14px;
            cursor: pointer;
            background-color: #ffc107;
            color: #212529;
            border: 1px solid #d39e00;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
        }
        .premium-btn:hover {
            background-color: #e0a800;
        }
        .logout-btn {
            padding: 6px 14px;
            cursor: pointer;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 13px;
        }
        .logout-btn:hover {
            background-color: #c82333;
        }
        form {
            background-color: #fafafa;
            border: 1px solid #e5e5e5;
            padding: 18px 20px;
            border-radius: 4px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #333;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        input:focus, select:focus {
            border-color: #007bff;
            outline: none;
        }
        .submit-btn {
            padding: 8px 18px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            margin-top: 5px;
        }
        .submit-btn:hover {
            background-color: #0069d9;
        }
        h3 {
            margin-top: 25px;
            margin-bottom: 12px;
            color: #333;
            font-size: 18px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 10px 12px;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: #f2f2f2;
            color: #333;
        }
        tr:nth-child(even) {
            background-color: #fafafa;
        }
        .delete-btn {
            padding: 4px 10px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 13px;
        }
        .delete-btn:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Expense Tracker</h2>
            <div class="header-actions">
                <button id="buyPremiumBtn" class="premium-btn">Buy Premium Membership</button>
                <button id="logoutBtn" class="logout-btn">Logout</button>
            </div>
        </div>

        <!-- Task 1: Form for entering money spent, description, and category dropdown -->
        <form id="expenseForm">
            <div class="form-group">
                <label for="amount">Choose expenseamount:</label>
                <input type="number" id="amount" name="amount" required placeholder="Enter amount">
            </div>

            <div class="form-group">
                <label for="description">Choose description:</label>
                <input type="text" id="description" name="description" required placeholder="Enter description">
            </div>

            <div class="form-group">
                <label for="category">Choose a category:</label>
                <select id="category" name="category" required>
                    <option value="Food">Food</option>
                    <option value="Petrol">Petrol</option>
                    <option value="Salary">Salary</option>
                    <option value="Movie">Movie</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <button type="submit" id="addExpenseBtn" class="submit-btn">Add Expense</button>
        </form>

        <!-- Task 3: Expense Table -->
        <h3>Expenses</h3>
        <table id="expenseTable">
            <thead>
                <tr>
                    <th>Expense Amount</th>
                    <th>Description</th>
                    <th>Category</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="expenseTableBody">
                <!-- Expenses will be dynamically loaded/added here -->
            </tbody>
        </table>
    </div>

    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="expense.js"></script>
</body>
</html>
