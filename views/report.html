<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Report</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 25px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header h2 {
            margin: 0;
            color: #333;
            font-size: 22px;
        }

        .back-link {
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        select {
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        select:focus {
            border-color: #007bff;
            outline: none;
        }

        /* Download Button & Hover Tooltip */
        .download-wrapper {
            position: relative;
            display: inline-block;
        }

        .download-btn {
            padding: 7px 16px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .download-btn:hover {
            background-color: #218838;
        }

        /* Non-premium disabled appearance */
        .download-btn.non-premium {
            background-color: #6c757d;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .premium-tooltip {
            display: none;
            position: absolute;
            bottom: 115%;
            right: 0;
            background-color: #212529;
            color: #ffc107;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            z-index: 10;
        }

        /* Show "Buy Premium" tooltip on hover for non-premium user */
        .download-wrapper:hover .premium-tooltip.visible {
            display: block;
        }

        /* Clean Table */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        table,
        th,
        td {
            border: 1px solid #ddd;
        }

        th,
        td {
            padding: 10px 12px;
            text-align: left;
            font-size: 14px;
        }

        th {
            background-color: #f2f2f2;
            color: #333;
        }

        tr:nth-child(even) {
            background-color: #fafafa;
        }

        .text-right {
            text-align: right;
        }

        .total-row {
            font-weight: bold;
            background-color: #f1f3f5 !important;
        }

        .empty-message {
            text-align: center;
            padding: 25px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h2>Expense Report</h2>
            <a href="/expense" class="back-link">← Back to Expenses</a>
        </div>

        <div class="toolbar">
            <div class="filter-group">
                <label for="periodSelect">Filter:</label>
                <select id="periodSelect">
                    <option value="monthly">Monthly Expenses (This Month)</option>
                    <option value="daily">Daily Expenses (Today)</option>
                    <option value="all">All Expenses</option>
                </select>
            </div>

            <div class="download-wrapper">
                <button id="downloadBtn" class="download-btn">Download Report</button>
                <div id="tooltip" class="premium-tooltip">🔒 Buy Premium to Download</div>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width: 25%;">Date</th>
                    <th style="width: 35%;">Description</th>
                    <th style="width: 20%;">Category</th>
                    <th style="width: 20%;" class="text-right">Amount</th>
                </tr>
            </thead>
            <tbody id="expenseTableBody">
                <tr>
                    <td colspan="4" class="empty-message">Loading expenses...</td>
                </tr>
            </tbody>
            <tfoot>
                <tr class="total-row" id="totalRow" style="display: none;">
                    <td colspan="3" class="text-right">Total:</td>
                    <td class="text-right" id="totalAmount">₹0.00</td>
                </tr>
            </tfoot>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        let allExpenses = [];

        const periodSelect = document.getElementById("periodSelect");
        const downloadBtn = document.getElementById("downloadBtn");
        const tooltip = document.getElementById("tooltip");
        const tableBody = document.getElementById("expenseTableBody");
        const totalRow = document.getElementById("totalRow");
        const totalAmountEl = document.getElementById("totalAmount");

        const isPremium = localStorage.getItem("isPremiumUser") === "true";
        if (!isPremium) {
            alert("Day to Day Reports are only for Premium Users! Please buy a membership.");
            window.location.href = "/expense";
        }

        const email = localStorage.getItem("userEmail") || "";
        const userId = localStorage.getItem("userId") || "";

        // Check premium status for download button
        if (isPremium) {
            downloadBtn.classList.remove("non-premium");
            downloadBtn.innerText = "Download Report (CSV)";
            tooltip.classList.remove("visible");
        } else {
            downloadBtn.classList.add("non-premium");
            downloadBtn.innerText = "Download Report";
            tooltip.classList.add("visible");
        }

        // Fetch real user expenses from backend API
        async function fetchExpenses() {
            try {
                const response = await axios.get("/api/expenses", {
                    params: { email, userId },
                    headers: {
                        "user-email": email,
                        "user-id": userId,
                    },
                });

                allExpenses = response.data || [];
                renderTable();
            } catch (err) {
                console.error("Error fetching expenses:", err);
                tableBody.innerHTML = `<tr><td colspan="4" class="empty-message">Failed to load expenses.</td></tr>`;
            }
        }

        // Filter and display expenses
        function renderTable() {
            const filter = periodSelect.value;
            const now = new Date();

            const filtered = allExpenses.filter(exp => {
                if (filter === "all") return true;

                const expDate = new Date(exp.createdAt || exp.updatedAt || Date.now());

                if (filter === "daily") {
                    return expDate.toDateString() === now.toDateString();
                } else if (filter === "monthly") {
                    return expDate.getMonth() === now.getMonth() && expDate.getFullYear() === now.getFullYear();
                }
                return true;
            });

            tableBody.innerHTML = "";

            if (filtered.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" class="empty-message">No expenses found for this period.</td></tr>`;
                totalRow.style.display = "none";
                return;
            }

            let total = 0;

            filtered.forEach(exp => {
                const amt = Number(exp.amount) || 0;
                total += amt;

                const dateObj = new Date(exp.createdAt || Date.now());
                const dateStr = dateObj.toLocaleDateString("en-IN", {
                    day: "2-digit",
                    month: "2-digit",
                    year: "numeric"
                });

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${dateStr}</td>
                    <td>${exp.description}</td>
                    <td>${exp.category}</td>
                    <td class="text-right">₹${amt.toFixed(2)}</td>
                `;
                tableBody.appendChild(tr);
            });

            totalAmountEl.innerText = `₹${total.toFixed(2)}`;
            totalRow.style.display = "table-row";
        }

        periodSelect.addEventListener("change", renderTable);

        // Download button click handling
        downloadBtn.addEventListener("click", () => {
            if (!isPremium) {
                alert("Only Premium Users can download reports! Please buy premium membership.");
                window.location.href = "/expense";
                return;
            }

            const filter = periodSelect.value;
            const now = new Date();

            const filtered = allExpenses.filter(exp => {
                if (filter === "all") return true;
                const expDate = new Date(exp.createdAt || exp.updatedAt || Date.now());
                if (filter === "daily") return expDate.toDateString() === now.toDateString();
                if (filter === "monthly") return expDate.getMonth() === now.getMonth() && expDate.getFullYear() === now.getFullYear();
                return true;
            });

            if (filtered.length === 0) {
                alert("No expenses to download.");
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,Date,Description,Category,Amount\n";
            filtered.forEach(exp => {
                const dateObj = new Date(exp.createdAt || Date.now());
                const dateStr = dateObj.toISOString().split("T")[0];
                csvContent += `${dateStr},"${exp.description}","${exp.category}",${exp.amount}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `expenses_${filter}_report.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        window.addEventListener("DOMContentLoaded", fetchExpenses);
    </script>
</body>

</html>
