<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 25px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header h2 {
            margin: 0;
            color: #333;
            font-size: 22px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .premium-headline {
            padding: 6px 14px;
            font-size: 13px;
            font-weight: bold;
            color: #856404;
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            border-radius: 4px;
            display: inline-block;
        }

        .leaderboard-btn {
            padding: 6px 14px;
            cursor: pointer;
            background-color: #17a2b8;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
        }

        .leaderboard-btn:hover {
            background-color: #138496;
        }

        .premium-btn {
            padding: 6px 14px;
            cursor: pointer;
            background-color: #ffc107;
            color: #212529;
            border: 1px solid #d39e00;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
        }

        .premium-btn:hover {
            background-color: #e0a800;
        }

        .logout-btn {
            padding: 6px 14px;
            cursor: pointer;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 13px;
        }

        .logout-btn:hover {
            background-color: #c82333;
        }

        .report-btn {
            padding: 6px 14px;
            cursor: pointer;
            background-color: #0097a7;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
        }

        .report-btn:hover {
            background-color: #00838f;
        }

        .report-btn.non-premium {
            background-color: #6c757d;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .btn-tooltip-wrapper {
            position: relative;
            display: inline-block;
        }

        .premium-tooltip-btn {
            display: none;
            position: absolute;
            bottom: 120%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #212529;
            color: #ffc107;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            z-index: 10;
        }

        .btn-tooltip-wrapper:hover .premium-tooltip-btn.visible {
            display: block;
        }

        .download-btn {
            padding: 6px 14px;
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
        }

        .download-btn:hover {
            background-color: #218838;
        }

        .download-btn:disabled {
            background-color: #6c757d;
            opacity: 0.65;
            cursor: not-allowed;
        }

        form {
            background-color: #fafafa;
            border: 1px solid #e5e5e5;
            padding: 18px 20px;
            border-radius: 4px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #333;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            border-color: #007bff;
            outline: none;
        }

        .submit-btn {
            padding: 8px 18px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            margin-top: 5px;
        }

        .submit-btn:hover {
            background-color: #0069d9;
        }

        .category-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .category-row select {
            flex: 1;
        }

        .ai-btn {
            padding: 8px 14px;
            cursor: pointer;
            background-color: #6f42c1;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
            transition: background-color 0.2s ease;
        }

        .ai-btn:hover {
            background-color: #5a32a3;
        }

        .ai-btn:disabled {
            background-color: #a389d4;
            cursor: not-allowed;
        }

        h3 {
            margin-top: 25px;
            margin-bottom: 12px;
            color: #333;
            font-size: 18px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        table,
        th,
        td {
            border: 1px solid #ddd;
        }

        th,
        td {
            padding: 10px 12px;
            text-align: left;
            font-size: 14px;
        }

        th {
            background-color: #f2f2f2;
            color: #333;
        }

        tr:nth-child(even) {
            background-color: #fafafa;
        }

        .delete-btn {
            padding: 4px 10px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 13px;
        }

        .delete-btn:hover {
            background-color: #c82333;
        }

        .leaderboard-container {
            margin-top: 30px;
        }

        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 15px;
            padding: 8px 0;
        }

        .pagination-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .page-btn {
            padding: 6px 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }

        .page-btn:hover {
            background-color: #0069d9;
        }

        .page-btn:disabled {
            background-color: #ced4da;
            color: #6c757d;
            cursor: not-allowed;
        }

        .page-info {
            padding: 5px 12px;
            background-color: #f8f9fa;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 14px;
            color: #333;
            font-weight: bold;
            min-width: 32px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h2>Expense Tracker</h2>
            <div class="header-actions">
                <div id="premiumHeadline" class="premium-headline" style="display: none;">You are a premium user now</div>
                <div class="btn-tooltip-wrapper">
                    <button id="reportsBtn" type="button" class="report-btn non-premium">Day to Day Report</button>
                    <div id="reportTooltip" class="premium-tooltip-btn visible">🔒 Buy Premium</div>
                </div>
                <button id="downloadExpensesBtn" class="download-btn" disabled title="Disabled for non-premium user">Download Expenses</button>
                <button id="showLeaderboardBtn" class="leaderboard-btn" style="display: none;">Show Leaderboard</button>
                <button id="buyPremiumBtn" class="premium-btn">Buy Premium Membership</button>
                <button id="logoutBtn" class="logout-btn">Logout</button>
            </div>
        </div>

        <form id="expenseForm">
            <div class="form-group">
                <label for="amount">Choose expenseamount:</label>
                <input type="number" id="amount" name="amount" required placeholder="Enter amount">
            </div>

            <div class="form-group">
                <label for="description">Choose description:</label>
                <input type="text" id="description" name="description" required placeholder="Enter description">
            </div>

            <div class="form-group">
                <label for="category">Choose a category:</label>
                <div class="category-row">
                    <select id="category" name="category" required>
                        <option value="Food">Food</option>
                        <option value="Petrol">Petrol</option>
                        <option value="Salary">Salary</option>
                        <option value="Movie">Movie</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Other">Other</option>
                    </select>
                    <button type="button" id="suggestCategoryBtn" class="ai-btn">AI Suggest</button>
                </div>
            </div>

            <button type="submit" id="addExpenseBtn" class="submit-btn">Add Expense</button>
        </form>

        <h3>Expenses</h3>
        <table id="expenseTable">
            <thead>
                <tr>
                    <th>Expense Amount</th>
                    <th>Description</th>
                    <th>Category</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="expenseTableBody">
            </tbody>
        </table>

        <!-- Simple Pagination Controls -->
        <div class="pagination-container" id="paginationContainer">
            <div class="pagination-buttons">
                <button id="prevBtn" type="button" class="page-btn">Previous</button>
                <span id="pageInfo" class="page-info">1</span>
                <button id="nextBtn" type="button" class="page-btn">Next</button>
            </div>
        </div>

        <div id="leaderboardSection" class="leaderboard-container" style="display: none;">
            <h3>Leader Board</h3>
            <table id="leaderboardTable">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Name</th>
                        <th>Total Expense</th>
                    </tr>
                </thead>
                <tbody id="leaderboardTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/js/expense.js"></script>
</body>

</html>
