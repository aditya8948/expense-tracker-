<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 40px 15px;
        }
        .container {
            max-width: 380px;
            margin: 0 auto;
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 25px;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #333;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        input:focus {
            border-color: #007bff;
            outline: none;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background-color: #007bff;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0069d9;
        }
        .btn-forgot {
            background-color: #6c757d;
            margin-top: 10px;
        }
        .btn-forgot:hover {
            background-color: #5a6268;
        }
        .btn-cancel {
            background-color: #f1f3f5;
            color: #495057;
            border: 1px solid #ced4da;
            margin-top: 8px;
        }
        .btn-cancel:hover {
            background-color: #e9ecef;
        }
        .link-text {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #007bff;
            text-decoration: none;
        }
        .link-text:hover {
            text-decoration: underline;
        }
        #message, #forgotMessage {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
        .error {
            color: #dc3545;
        }
        .success {
            color: #28a745;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Enter your email:</label>
                <input type="email" id="email" name="email" placeholder="Email address" required>
            </div>

            <div class="form-group">
                <label for="password">Enter your password:</label>
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>

            <button type="submit">Login</button>
        </form>

        <button type="button" id="forgotPasswordBtn" class="btn-forgot">Forgot Password?</button>

        <!-- Forgot Password Form (Hidden by default) -->
        <div id="forgotPasswordContainer" style="display: none; margin-top: 20px; padding-top: 18px; border-top: 1px solid #eee;">
            <h3 style="font-size: 17px; margin-top: 0; color: #333; text-align: center;">Reset Password</h3>
            <p style="font-size: 13px; color: #666; text-align: center; margin-bottom: 15px;">Enter your registered email to receive a reset link.</p>
            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="forgotEmail">Enter your email:</label>
                    <input type="email" id="forgotEmail" name="forgotEmail" placeholder="Email address" required>
                </div>

                <button type="submit" id="forgotSubmitBtn">Send Reset Mail</button>
                <button type="button" id="cancelForgotBtn" class="btn-cancel">Cancel</button>
            </form>
            <div id="forgotMessage"></div>
        </div>

        <a class="link-text" href="/signup">New User - Signup</a>
        <div id="message"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
